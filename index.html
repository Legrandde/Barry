<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (deuxième photo du portfolio) -->
    <link rel="icon" type="image/jpeg" href="/barry.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="/barry.jpeg" />
    <link rel="apple-touch-icon" href="/barry.jpeg" />

    <!-- SEO principal -->
    <title>Alhassane Barry — Développeur Full-stack Web & Mobile</title>
    <meta
      name="description"
      content="Portfolio d'Alhassane Barry, développeur Full-stack spécialisé en React, TypeScript, React Native, NestJS, Django et architectures modernes. Découvrez mes projets, services et compétences."
    />
    <meta
      name="keywords"
      content="Alhassane Barry, Barry Alhassane, développeur full-stack, développeur web, développeur mobile, React, TypeScript, React Native, NestJS, Django, FastAPI, portfolio, Guinée, Dakar"
    />
    <meta name="author" content="Alhassane Barry" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f59e0b" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Alhassane Barry — Portfolio" />
    <meta property="og:title" content="Alhassane Barry — Développeur Full-stack Web & Mobile" />
    <meta
      property="og:description"
      content="Passionné par le développement web et mobile, je transforme vos idées en solutions numériques performantes (React, TypeScript, React Native, NestJS, Django)."
    />
    <meta property="og:image" content="/barry.jpeg" />
    <meta property="og:image:alt" content="Portrait d'Alhassane Barry" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alhassane Barry — Développeur Full-stack Web & Mobile" />
    <meta
      name="twitter:description"
      content="Développeur Full-stack spécialisé en React, TypeScript, React Native, NestJS et Django."
    />
    <meta name="twitter:image" content="/barry.jpeg" />

    <!-- Données structurées JSON-LD (complétées dynamiquement depuis le CMS) -->
    <script id="jsonld-person" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alhassane Barry",
        "jobTitle": "Développeur Full-stack",
        "description": "Développeur Full-stack spécialisé en React, TypeScript, React Native, NestJS et Django.",
        "image": "/barry.jpeg"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
